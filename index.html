<!DOCTYPE html>
<html lang="en" class="antialiased">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <title>SSC Math Master | Pro Edition</title>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined|Material+Icons+Round" rel="stylesheet"/>

    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre'] },
            startup: { typeset: false }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#006a4e",
                        "primary-dark": "#059669", 
                        "accent": "#f42a41",
                        "bg-light": "#f3f4f6",
                        "bg-dark": "#0f172a",
                        "card-light": "#ffffff",
                        "card-dark": "#1e293b",
                        "text-light": "#1e293b",
                        "text-dark": "#f1f5f9",
                    },
                    fontFamily: { "display": ["Lexend", "sans-serif"] }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Lexend', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        /* Transitions & Animations */
        .screen { display: none; opacity: 0; transition: opacity 0.3s ease-in-out; }
        .screen.active { display: flex; opacity: 1; flex-direction: column; min-height: 100vh; }
        
        .fade-enter { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }

        /* Toast Notification */
        #toast { visibility: hidden; min-width: 250px; margin-left: -125px; background-color: #333; color: #fff; text-align: center; border-radius: 8px; padding: 16px; position: fixed; z-index: 100; left: 50%; bottom: 30px; font-size: 14px; opacity: 0; transition: opacity 0.3s, bottom 0.3s; }
        #toast.show { visibility: visible; opacity: 1; bottom: 50px; }
    </style>
</head>
<body class="bg-bg-light dark:bg-bg-dark text-text-light dark:text-text-dark transition-colors duration-300">

    <button onclick="App.toggleTheme()" class="fixed top-4 right-4 z-50 p-3 rounded-full bg-white dark:bg-card-dark shadow-lg text-slate-600 dark:text-slate-300 hover:scale-110 transition-transform">
        <span class="material-icons-round" id="theme-icon">dark_mode</span>
    </button>

    <div id="toast">Notification</div>

    <div id="screen-setup" class="screen active">
        <div class="max-w-md mx-auto p-6 w-full flex flex-col justify-center min-h-screen">
            <div class="text-center mb-8 fade-enter">
                <div class="w-24 h-24 bg-primary/10 dark:bg-primary/20 rounded-3xl flex items-center justify-center mx-auto mb-6 shadow-xl shadow-primary/10">
                    <span class="material-icons text-primary dark:text-primary-dark text-5xl">functions</span>
                </div>
                <h1 class="text-3xl font-bold mb-2">SSC Math Master</h1>
                <div class="flex items-center justify-center gap-2">
                    <span class="px-2 py-1 bg-slate-200 dark:bg-slate-700 rounded text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300">Pro Edition</span>
                </div>
                <p id="connection-status" class="text-sm mt-4 italic opacity-70">Connecting...</p>
            </div>

            <div class="bg-card-light dark:bg-card-dark p-8 rounded-3xl shadow-xl dark:shadow-black/20 space-y-6 fade-enter" style="animation-delay: 0.1s">
                <div>
                    <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 mb-2 uppercase tracking-widest">Select Chapter</label>
                    <div class="relative">
                        <select id="select-chapter" class="w-full p-4 pr-10 rounded-2xl bg-slate-50 dark:bg-slate-800 border-2 border-slate-100 dark:border-slate-700 focus:border-primary dark:focus:border-primary-dark outline-none appearance-none font-medium transition-all cursor-pointer">
                            <option>Loading...</option>
                        </select>
                        <span class="material-icons absolute right-4 top-4 text-slate-400 pointer-events-none">expand_more</span>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 mb-2 uppercase tracking-widest">Question Count</label>
                    <div class="grid grid-cols-4 gap-2">
                        <button onclick="App.setCount(5)" class="count-btn p-3 rounded-xl border-2 border-slate-100 dark:border-slate-700 font-bold hover:border-primary transition-all" data-val="5">5</button>
                        <button onclick="App.setCount(10)" class="count-btn p-3 rounded-xl border-2 border-primary bg-primary/10 dark:bg-primary/20 text-primary dark:text-primary-dark font-bold transition-all" data-val="10">10</button>
                        <button onclick="App.setCount(25)" class="count-btn p-3 rounded-xl border-2 border-slate-100 dark:border-slate-700 font-bold hover:border-primary transition-all" data-val="25">25</button>
                        <button onclick="App.setCount(50)" class="count-btn p-3 rounded-xl border-2 border-slate-100 dark:border-slate-700 font-bold hover:border-primary transition-all" data-val="50">50</button>
                    </div>
                </div>

                <div class="pt-2">
                    <button onclick="App.start()" class="w-full bg-primary hover:bg-primary-dark text-white font-bold py-5 rounded-2xl shadow-lg shadow-primary/25 active:scale-95 transition-all flex items-center justify-center gap-2 group">
                        <span>Start Quiz</span>
                        <span class="material-icons group-hover:translate-x-1 transition-transform">arrow_forward</span>
                    </button>
                </div>
            </div>
            
            <p class="text-center text-xs text-slate-400 mt-8">Press <span class="font-mono bg-slate-200 dark:bg-slate-700 px-1 rounded">1-4</span> to answer, <span class="font-mono bg-slate-200 dark:bg-slate-700 px-1 rounded">Arrows</span> to navigate.</p>
        </div>
    </div>

    <div id="screen-quiz" class="screen w-full relative">
        <div class="max-w-md mx-auto w-full flex flex-col min-h-screen bg-card-light dark:bg-card-dark shadow-2xl transition-colors duration-300">
            <div class="p-4 flex items-center justify-between border-b border-slate-100 dark:border-slate-800 sticky top-0 bg-card-light/95 dark:bg-card-dark/95 backdrop-blur z-20">
                <div class="flex items-center gap-3">
                     <div class="w-10 h-10 rounded-xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center">
                        <span class="font-bold text-slate-700 dark:text-slate-200" id="q-current">1</span>
                     </div>
                     <div class="flex flex-col">
                        <span class="text-[10px] uppercase font-bold text-slate-400">Time Left</span>
                        <span id="timer-display" class="font-mono font-bold text-lg text-accent leading-none">00:00</span>
                     </div>
                </div>
                
                <div class="flex gap-2">
                    <button onclick="App.toggleFlag()" id="flag-btn" class="p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
                        <span class="material-icons-outlined text-xl">flag</span>
                    </button>
                    <button onclick="App.togglePalette()" class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">
                        <span class="material-icons text-xl">grid_view</span>
                    </button>
                </div>
            </div>

            <div class="h-1.5 bg-slate-100 dark:bg-slate-800 w-full">
                <div id="progress-bar" class="h-full bg-primary transition-all duration-500 ease-out" style="width: 0%"></div>
            </div>

            <div class="p-6 flex-1 overflow-y-auto">
                <div class="min-h-[100px] mb-6">
                    <div id="question-text" class="text-xl font-medium text-slate-800 dark:text-slate-100 math-content leading-relaxed"></div>
                </div>
                <div id="options-container" class="space-y-3 pb-20"></div>
            </div>

            <div class="p-5 border-t border-slate-100 dark:border-slate-800 flex gap-3 sticky bottom-0 bg-card-light/95 dark:bg-card-dark/95 backdrop-blur">
                <button onclick="App.move(-1)" class="w-14 h-14 flex items-center justify-center rounded-2xl border-2 border-slate-200 dark:border-slate-700 text-slate-400 dark:text-slate-500 hover:bg-slate-50 dark:hover:bg-slate-800 active:scale-95 transition-all">
                    <span class="material-icons">arrow_back</span>
                </button>
                <button id="next-btn" onclick="App.move(1)" class="flex-1 h-14 bg-primary text-white rounded-2xl font-bold shadow-lg shadow-primary/20 active:scale-95 transition-all flex items-center justify-center gap-2">
                    Next Question
                </button>
                <button id="submit-btn" onclick="App.finish()" class="hidden flex-1 h-14 bg-accent text-white rounded-2xl font-bold shadow-lg shadow-accent/20 active:scale-95 transition-all flex items-center justify-center gap-2">
                    Submit Quiz <span class="material-icons text-sm">check_circle</span>
                </button>
            </div>
        </div>

        <div id="palette-overlay" onclick="App.togglePalette()" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity z-40"></div>
        <div id="palette-modal" class="fixed bottom-0 left-0 right-0 bg-white dark:bg-slate-900 rounded-t-[2rem] z-50 p-6 max-h-[75vh] overflow-y-auto shadow-[0_-10px_40px_rgba(0,0,0,0.2)] transform translate-y-full transition-transform duration-300">
            <div class="w-12 h-1.5 bg-slate-200 dark:bg-slate-700 rounded-full mx-auto mb-6"></div>
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-lg font-bold">Question Map</h3>
                <span class="text-xs font-bold px-2 py-1 bg-slate-100 dark:bg-slate-800 rounded text-slate-500" id="map-stats">0/10 Answered</span>
            </div>
            <div id="palette-grid" class="grid grid-cols-5 gap-3 mb-4"></div>
        </div>
    </div>

    <div id="screen-results" class="screen w-full bg-slate-50 dark:bg-bg-dark">
        <div class="max-w-md mx-auto min-h-screen flex flex-col">
            <div class="pt-12 pb-16 px-6 text-center bg-primary dark:bg-slate-900 text-white rounded-b-[3rem] shadow-xl relative overflow-hidden">
                <div class="absolute top-0 left-0 w-32 h-32 bg-white/5 rounded-full -translate-x-10 -translate-y-10"></div>
                <div class="absolute bottom-0 right-0 w-40 h-40 bg-white/5 rounded-full translate-x-10 translate-y-10"></div>
                
                <h1 class="text-2xl font-bold relative z-10 mb-2">Quiz Complete!</h1>
                <div class="text-6xl font-black relative z-10 mb-1 tracking-tight" id="final-score">0</div>
                <div class="text-xs font-bold uppercase tracking-widest opacity-80 mb-6">Total Score</div>
                
                <div class="flex justify-center gap-4 relative z-10">
                    <button onclick="App.shareResults()" class="flex items-center gap-2 px-4 py-2 bg-white/20 hover:bg-white/30 backdrop-blur rounded-xl text-sm font-bold transition-colors">
                        <span class="material-icons text-sm">share</span> Share
                    </button>
                    <button onclick="location.reload()" class="flex items-center gap-2 px-4 py-2 bg-white text-primary rounded-xl text-sm font-bold shadow-lg active:scale-95 transition-transform">
                        <span class="material-icons text-sm">refresh</span> Retry
                    </button>
                </div>
            </div>

            <div class="px-6 -mt-8 relative z-20">
                <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-lg border border-slate-100 dark:border-slate-700 p-6 flex justify-between text-center">
                    <div>
                        <div class="text-xl font-bold text-slate-800 dark:text-white" id="stat-total">0</div>
                        <div class="text-[10px] font-bold text-slate-400 uppercase mt-1">Total</div>
                    </div>
                    <div class="w-px bg-slate-100 dark:bg-slate-700"></div>
                    <div>
                        <div class="text-xl font-bold text-green-500" id="stat-accuracy">0%</div>
                        <div class="text-[10px] font-bold text-slate-400 uppercase mt-1">Accuracy</div>
                    </div>
                    <div class="w-px bg-slate-100 dark:bg-slate-700"></div>
                    <div>
                        <div class="text-xl font-bold text-accent" id="stat-wrong">0</div>
                        <div class="text-[10px] font-bold text-slate-400 uppercase mt-1">Mistakes</div>
                    </div>
                </div>
            </div>

            <div class="p-6 flex-1">
                <h4 class="font-bold text-slate-800 dark:text-slate-200 mb-4 ml-1">Detailed Analysis</h4>
                <div id="review-container" class="space-y-4 pb-10"></div>
            </div>
        </div>
    </div>

    <script>
        const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRJZEkxEDWul6x7wRY41Kynb-JF-4ZE5L9jLhYy2qgdlM3gKjB2vPAMG19CCwBhcUW3f1NR71IxOLT-/pub?output=csv";

        const App = {
            state: {
                questions: [],
                currentSet: [],
                answers: {},
                flags: new Set(),
                index: 0,
                timer: null,
                timeLeft: 0,
                selectedCount: 5,
                paletteOpen: false,
                quizActive: false
            },

            // Demo data for offline testing
            demoData: [
                { Chapter: "Algebra", Question: "If $x + \\frac{1}{x} = 2$, find $x^2 + \\frac{1}{x^2}$", OptionA: "2", OptionB: "4", OptionC: "0", OptionD: "1", Correct: "A" },
                { Chapter: "Geometry", Question: "The sum of angles in a triangle is?", OptionA: "90°", OptionB: "180°", OptionC: "360°", OptionD: "270°", Correct: "B" },
                { Chapter: "Trigonometry", Question: "Value of $\\sin(90^\\circ)$?", OptionA: "0", OptionB: "1", OptionC: "undefined", OptionD: "0.5", Correct: "B" }
            ],

            init() {
                this.loadTheme();
                this.bindKeyboard();
                this.fetchData();
            },

            // --- Theme Management ---
            toggleTheme() {
                const html = document.documentElement;
                const icon = document.getElementById('theme-icon');
                if (html.classList.contains('dark')) {
                    html.classList.remove('dark');
                    localStorage.theme = 'light';
                    icon.innerText = 'dark_mode';
                } else {
                    html.classList.add('dark');
                    localStorage.theme = 'dark';
                    icon.innerText = 'light_mode';
                }
            },

            loadTheme() {
                const saved = localStorage.theme;
                const sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                const icon = document.getElementById('theme-icon');
                
                if (saved === 'dark' || (!saved && sysDark)) {
                    document.documentElement.classList.add('dark');
                    icon.innerText = 'light_mode';
                } else {
                    document.documentElement.classList.remove('dark');
                    icon.innerText = 'dark_mode';
                }
            },

            // --- Data Handling ---
            async fetchData() {
                try {
                    const response = await fetch(SHEET_URL);
                    if(!response.ok) throw new Error("Network response was not ok");
                    const csvText = await response.text();
                    this.state.questions = this.parseCSV(csvText);
                    this.updateStatus('● Connected to Database', 'text-green-600 dark:text-green-400');
                } catch (e) {
                    this.state.questions = this.demoData;
                    this.updateStatus('● Offline Demo Mode', 'text-orange-500');
                    this.showToast("Network error: Loaded demo questions");
                }
                this.populateChapters();
            },

            updateStatus(msg, classes) {
                const el = document.getElementById('connection-status');
                el.innerText = msg;
                el.className = `text-xs font-bold mt-4 ${classes}`;
            },

            parseCSV(text) {
                const rows = text.split('\n').filter(r => r.trim());
                const headers = rows[0].split(',').map(h => h.trim());
                return rows.slice(1).map(row => {
                    // Regex handles commas inside quotes
                    const values = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim());
                    let obj = {};
                    headers.forEach((h, i) => obj[h] = values[i]);
                    return obj;
                });
            },

            populateChapters() {
                const chapters = [...new Set(this.state.questions.map(q => q.Chapter))];
                const select = document.getElementById('select-chapter');
                select.innerHTML = '';
                
                // Load last used chapter from localstorage
                const lastChap = localStorage.getItem('lastChapter');
                
                chapters.forEach(chap => {
                    const opt = document.createElement('option');
                    opt.value = chap; opt.innerText = chap;
                    if(chap === lastChap) opt.selected = true;
                    select.appendChild(opt);
                });
            },

            setCount(val) {
                this.state.selectedCount = val;
                document.querySelectorAll('.count-btn').forEach(btn => {
                    const isActive = parseInt(btn.dataset.val) === val;
                    btn.className = isActive 
                        ? 'count-btn p-3 rounded-xl border-2 border-primary bg-primary/10 dark:bg-primary/20 text-primary dark:text-primary-dark font-bold transition-all transform scale-105' 
                        : 'count-btn p-3 rounded-xl border-2 border-slate-100 dark:border-slate-700 text-slate-500 hover:border-primary transition-all';
                });
            },

            // --- Quiz Logic ---
            start() {
                const chap = document.getElementById('select-chapter').value;
                localStorage.setItem('lastChapter', chap); // Save preference

                const pool = this.state.questions.filter(q => q.Chapter === chap);
                this.state.currentSet = pool.sort(() => 0.5 - Math.random()).slice(0, this.state.selectedCount);
                
                if(this.state.currentSet.length === 0) return this.showToast("No questions found for this chapter!");

                this.state.timeLeft = this.state.currentSet.length * 60; // 1 min per question
                this.state.index = 0;
                this.state.answers = {};
                this.state.flags = new Set();
                this.state.quizActive = true;

                this.switchScreen('screen-quiz');
                this.renderQuestion();
                this.updatePalette();
                this.startTimer();
            },

            switchScreen(id) {
                document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                document.getElementById(id).classList.add('active');
                window.scrollTo(0,0);
            },

            startTimer() {
                if(this.state.timer) clearInterval(this.state.timer);
                this.state.timer = setInterval(() => {
                    this.state.timeLeft--;
                    let m = Math.floor(this.state.timeLeft / 60);
                    let s = this.state.timeLeft % 60;
                    const timeStr = `${m}:${s < 10 ? '0'+s : s}`;
                    document.getElementById('timer-display').innerText = timeStr;
                    
                    if(this.state.timeLeft <= 10) document.getElementById('timer-display').classList.add('text-red-500', 'animate-pulse');
                    
                    if(this.state.timeLeft <= 0) {
                        this.showToast("Time's Up!");
                        this.finish();
                    }
                }, 1000);
            },

            renderQuestion() {
                const q = this.state.currentSet[this.state.index];
                document.getElementById('q-current').innerText = this.state.index + 1;
                document.getElementById('progress-bar').style.width = `${((this.state.index + 1) / this.state.currentSet.length) * 100}%`;

                const qTextEl = document.getElementById('question-text');
                qTextEl.innerHTML = q.Question;

                const container = document.getElementById('options-container');
                container.innerHTML = '';

                ['A','B','C','D'].forEach((key, idx) => {
                    const isSelected = this.state.answers[this.state.index] === key;
                    const btn = document.createElement('button');
                    // Style logic for dark/light mode and selection
                    let baseClass = "w-full text-left p-4 rounded-2xl border-2 transition-all flex items-center group relative overflow-hidden ";
                    let colorClass = isSelected 
                        ? "border-primary bg-primary/5 dark:bg-primary/20 " 
                        : "border-slate-100 dark:border-slate-700 bg-white dark:bg-slate-800 hover:border-primary/50 dark:hover:border-primary/50 ";
                    
                    btn.className = baseClass + colorClass;
                    
                    // Keyboard shortcut hint
                    const hotkey = (idx + 1);
                    
                    btn.innerHTML = `
                        <div class="w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold mr-4 transition-colors ${isSelected ? 'bg-primary text-white' : 'bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-400 group-hover:bg-primary/10'}">${key}</div>
                        <div class="flex-1 font-medium text-slate-700 dark:text-slate-200">${q['Option'+key]}</div>
                        <div class="absolute right-2 top-2 text-[10px] text-slate-300 opacity-0 group-hover:opacity-100 transition-opacity font-mono border border-slate-200 rounded px-1">${hotkey}</div>
                    `;
                    btn.onclick = () => { this.selectAnswer(key); };
                    container.appendChild(btn);
                });

                // Update navigation buttons
                const isLast = this.state.index === this.state.currentSet.length - 1;
                document.getElementById('next-btn').style.display = isLast ? 'none' : 'flex';
                document.getElementById('submit-btn').style.display = isLast ? 'flex' : 'none';

                // Update Flag styling
                const flagBtn = document.getElementById('flag-btn');
                flagBtn.className = this.state.flags.has(this.state.index) 
                    ? 'p-2.5 rounded-xl border-2 border-yellow-400 bg-yellow-50 dark:bg-yellow-900/30 text-yellow-600 dark:text-yellow-400' 
                    : 'p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-400';

                if (window.MathJax) MathJax.typesetPromise([qTextEl, container]);
            },

            selectAnswer(key) {
                this.state.answers[this.state.index] = key;
                this.renderQuestion();
                this.updatePalette();
                
                // Auto move logic (optional, removed for better control)
                // if(this.state.index < this.state.currentSet.length - 1) setTimeout(() => this.move(1), 300);
            },

            move(dir) {
                const newIdx = this.state.index + dir;
                if(newIdx >= 0 && newIdx < this.state.currentSet.length) {
                    this.state.index = newIdx;
                    this.renderQuestion();
                }
            },

            toggleFlag() {
                const i = this.state.index;
                if(this.state.flags.has(i)) this.state.flags.delete(i);
                else {
                    this.state.flags.add(i);
                    this.showToast("Question Flagged");
                }
                this.renderQuestion();
                this.updatePalette();
            },

            togglePalette() {
                const modal = document.getElementById('palette-modal');
                const overlay = document.getElementById('palette-overlay');
                this.state.paletteOpen = !this.state.paletteOpen;
                
                if(this.state.paletteOpen) {
                    modal.style.transform = "translateY(0)";
                    overlay.style.opacity = '1';
                    overlay.style.pointerEvents = 'auto';
                } else {
                    modal.style.transform = "translateY(100%)";
                    overlay.style.opacity = '0';
                    overlay.style.pointerEvents = 'none';
                }
            },

            updatePalette() {
                const grid = document.getElementById('palette-grid');
                grid.innerHTML = '';
                let answeredCount = 0;

                this.state.currentSet.forEach((_, i) => {
                    const btn = document.createElement('button');
                    let bg = "bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-400";
                    
                    if (this.state.answers[i]) {
                        bg = "bg-primary border-primary text-white";
                        answeredCount++;
                    }
                    if (this.state.flags.has(i)) bg = "bg-yellow-100 dark:bg-yellow-900 border-yellow-400 text-yellow-700 dark:text-yellow-400";
                    if (i === this.state.index) bg += " ring-2 ring-offset-2 ring-primary dark:ring-offset-slate-900";

                    btn.className = `aspect-square rounded-xl font-bold text-sm border transition-all ${bg}`;
                    btn.innerText = i + 1;
                    btn.onclick = () => { this.state.index = i; this.renderQuestion(); this.togglePalette(); };
                    grid.appendChild(btn);
                });
                
                document.getElementById('map-stats').innerText = `${answeredCount}/${this.state.currentSet.length} Answered`;
            },

            // --- Keyboard Shortcuts ---
            bindKeyboard() {
                document.addEventListener('keydown', (e) => {
                    if(!this.state.quizActive) return;

                    if(e.key === 'ArrowRight') this.move(1);
                    if(e.key === 'ArrowLeft') this.move(-1);
                    
                    // Options selection 1-4
                    if(['1','2','3','4'].includes(e.key)) {
                        const map = {'1':'A', '2':'B', '3':'C', '4':'D'};
                        this.selectAnswer(map[e.key]);
                    }
                    // Options selection a-d
                    if(['a','b','c','d'].includes(e.key.toLowerCase())) {
                        this.selectAnswer(e.key.toUpperCase());
                    }
                    // Flagging
                    if(e.key.toLowerCase() === 'f') this.toggleFlag();
                });
            },

            // --- Finish & Review ---
            finish() {
                if(!confirm("Are you sure you want to finish?")) return;
                
                this.state.quizActive = false;
                clearInterval(this.state.timer);
                
                let score = 0, wrong = 0;
                let reviewData = [];

                this.state.currentSet.forEach((q, i) => {
                    const userAns = this.state.answers[i];
                    const isCorrect = userAns === q.Correct;

                    if (isCorrect) score++;
                    else if (userAns) wrong++;

                    reviewData.push({
                        q: q,
                        user: userAns,
                        correct: isCorrect,
                        status: userAns ? (isCorrect ? 'correct' : 'incorrect') : 'skipped'
                    });
                });

                this.switchScreen('screen-results');

                // Animate Numbers
                this.animateValue("final-score", 0, score, 1000);
                document.getElementById('stat-total').innerText = this.state.currentSet.length;
                document.getElementById('stat-wrong').innerText = wrong;
                document.getElementById('stat-accuracy').innerText = Math.round((score / this.state.currentSet.length) * 100) + '%';

                // Render Review
                const container = document.getElementById('review-container');
                container.innerHTML = '';

                reviewData.forEach((item, i) => {
                    const card = document.createElement('div');
                    card.className = "p-5 rounded-2xl border bg-white dark:bg-slate-800 shadow-sm transition-colors " + 
                                     (item.status === 'correct' ? 'border-green-200 dark:border-green-900/50' : 
                                      item.status === 'incorrect' ? 'border-red-200 dark:border-red-900/50' : 
                                      'border-slate-100 dark:border-slate-700');

                    let badgeColor = item.status === 'correct' ? 'bg-green-100 text-green-700' : 
                                     item.status === 'incorrect' ? 'bg-red-100 text-red-700' : 'bg-slate-100 text-slate-600';

                    let optionsHtml = '';
                    ['A', 'B', 'C', 'D'].forEach(key => {
                        let style = 'border-slate-100 dark:border-slate-700 text-slate-500 dark:text-slate-400 opacity-70';
                        let icon = '';

                        if (key === item.q.Correct) {
                            style = 'bg-green-50 dark:bg-green-900/20 border-green-500 text-green-700 dark:text-green-400 font-bold opacity-100';
                            icon = 'check_circle';
                        } else if (key === item.user && item.status === 'incorrect') {
                            style = 'bg-red-50 dark:bg-red-900/20 border-red-400 text-red-700 dark:text-red-400 font-bold opacity-100';
                            icon = 'cancel';
                        }

                        optionsHtml += `
                            <div class="flex items-center p-2.5 mb-2 rounded-xl border text-sm ${style}">
                                <span class="w-6 font-bold">${key}.</span>
                                <span class="flex-1">${item.q['Option'+key]}</span>
                                ${icon ? `<span class="material-icons text-sm ml-2">${icon}</span>` : ''}
                            </div>
                        `;
                    });

                    card.innerHTML = `
                        <div class="flex justify-between items-start mb-3">
                            <span class="text-xs font-bold text-slate-400">Question ${i + 1}</span>
                            <span class="${badgeColor} px-2 py-0.5 rounded text-[10px] font-black uppercase">${item.status}</span>
                        </div>
                        <div class="text-slate-800 dark:text-slate-200 font-medium mb-4 math-content text-lg">${item.q.Question}</div>
                        <div class="space-y-1">${optionsHtml}</div>
                    `;
                    container.appendChild(card);
                });

                if (window.MathJax) MathJax.typesetPromise([container]);
            },

            // --- Utilities ---
            showToast(msg) {
                const t = document.getElementById('toast');
                t.innerText = msg;
                t.className = "show";
                setTimeout(() => { t.className = t.className.replace("show", ""); }, 3000);
            },

            shareResults() {
                const score = document.getElementById('final-score').innerText;
                const total = document.getElementById('stat-total').innerText;
                const text = `I scored ${score}/${total} on SSC Math Master! Can you beat me?`;
                navigator.clipboard.writeText(text).then(() => this.showToast("Result copied to clipboard!"));
            },

            animateValue(id, start, end, duration) {
                const obj = document.getElementById(id);
                let startTimestamp = null;
                const step = (timestamp) => {
                    if (!startTimestamp) startTimestamp = timestamp;
                    const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                    obj.innerHTML = Math.floor(progress * (end - start) + start);
                    if (progress < 1) window.requestAnimationFrame(step);
                };
                window.requestAnimationFrame(step);
            }
        };

        document.addEventListener('DOMContentLoaded', () => App.init());
    </script>
</body>
</html>
