<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <title>SSC Math Master | Pro Edition</title>
    
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined" rel="stylesheet"/>
    
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre']
            },
            startup: {
                typeset: false
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#006a4e",
                        "primary-dark": "#00523c",
                        "accent": "#f42a41",
                        "background-light": "#f6f6f8",
                        "background-dark": "#101622",
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"]
                    },
                    borderRadius: {
                        "xl": "1rem",
                        "2xl": "1.5rem",
                    },
                },
            },
        }
    </script>

    <style>
        body {
            font-family: 'Lexend', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            background-color: #f6f6f8;
        }
        .screen {
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }
        .screen.active {
            display: flex;
            opacity: 1;
            flex-direction: column;
            min-height: 100vh;
        }
        .math-content {
            overflow-x: auto;
        }
        .palette-modal {
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .palette-modal.open {
            transform: translateY(0);
        }
        .review-item .correct { color: #059669; font-weight: bold; }
        .review-item .incorrect { color: #dc2626; font-weight: bold; }
        .review-item .skipped { color: #d97706; font-weight: bold; }
    </style>
</head>
<body class="text-slate-900 bg-background-light">

    <div id="screen-setup" class="screen active">
        <div class="max-w-md mx-auto p-6 w-full flex flex-col justify-center min-h-screen">
            <div class="text-center mb-8">
                <div class="w-20 h-20 bg-primary/10 rounded-3xl flex items-center justify-center mx-auto mb-4">
                    <span class="material-icons text-primary text-4xl">functions</span>
                </div>
                <h1 class="text-3xl font-bold text-slate-900">SSC Math Master</h1>
                <p id="connection-status" class="text-sm text-slate-500 mt-2 italic">Connecting to database...</p>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 space-y-6">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2 uppercase tracking-wide">Select Chapter</label>
                    <select id="select-chapter" class="w-full p-4 rounded-xl border-2 border-slate-100 focus:border-primary outline-none transition-all">
                        <option>Loading chapters...</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2 uppercase tracking-wide">Questions Count</label>
                    <select id="selected-count" class="w-full p-4 rounded-xl border-2 border-slate-100 focus:border-primary outline-none transition-all">
                        <option value="5">5 Questions</option>
                        <option value="10">10 Questions</option>
                        <option value="25">25 Questions</option>
                        <option value="50">50 Questions</option>
                    </select>
                </div>

                <button onclick="App.start()" class="w-full bg-primary text-white font-bold py-4 rounded-xl shadow-lg shadow-primary/20 hover:bg-primary-dark transition-all">
                    Start Practice
                </button>
            </div>
        </div>
    </div>

    <div id="screen-quiz" class="screen w-full relative">
        <div class="max-w-md mx-auto w-full flex flex-col min-h-screen bg-white shadow-xl">
            <div class="p-4 flex items-center justify-between border-b sticky top-0 bg-white z-20">
                <div id="timer-display" class="font-mono font-black text-xl text-accent">00:00</div>
                <div class="flex gap-2">
                    <button id="flag-btn" onclick="App.toggleFlag()" class="p-2 rounded-xl border-2 border-slate-100 text-slate-400 transition-colors">
                        <span class="material-icons-outlined">flag</span>
                    </button>
                    <button onclick="App.togglePalette()" class="p-2 rounded-xl bg-slate-50 text-slate-600">
                        <span class="material-icons">grid_view</span>
                    </button>
                </div>
            </div>

            <div class="h-1.5 bg-slate-100 w-full">
                <div id="progress-bar" class="h-full bg-primary transition-all duration-500" style="width: 0%"></div>
            </div>

            <div class="p-6 flex-1 overflow-y-auto">
                <div id="progress-text" class="text-xs font-bold text-primary uppercase tracking-widest mb-4">Question 1 / 10</div>
                <div id="question-text" class="text-xl font-medium text-slate-800 mb-8 math-content leading-relaxed"></div>
                <div id="options-container" class="space-y-4"></div>
            </div>

            <div class="p-6 bg-slate-50 border-t flex gap-3 sticky bottom-0">
                <button onclick="App.move(-1)" class="flex-1 py-4 bg-white border-2 border-slate-200 rounded-xl font-bold text-slate-600 active:scale-95 transition-all">Back</button>
                <button id="next-btn" onclick="App.move(1)" class="flex-1 py-4 bg-primary text-white rounded-xl font-bold shadow-md active:scale-95 transition-all">Next</button>
                <button id="submit-btn" onclick="App.finish()" class="hidden flex-1 py-4 bg-accent text-white rounded-xl font-bold shadow-md active:scale-95 transition-all">Submit Quiz</button>
            </div>
        </div>

        <div id="palette-overlay" onclick="App.togglePalette()" class="fixed inset-0 bg-slate-900/40 opacity-0 pointer-events-none transition-opacity z-40"></div>
        <div id="palette-modal" class="palette-modal fixed bottom-0 left-0 right-0 bg-white rounded-t-[2.5rem] z-50 p-8 max-h-[70vh] overflow-y-auto shadow-2xl">
            <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-6"></div>
            <h3 class="text-xl font-bold mb-6 text-center">Question Overview</h3>
            <div id="palette-grid" class="grid grid-cols-5 gap-3"></div>
        </div>
    </div>

    <div id="screen-results" class="screen w-full bg-white">
        <div class="max-w-md mx-auto min-h-screen flex flex-col">
            <div class="pt-12 pb-8 px-6 text-center bg-slate-50">
                <div class="inline-flex items-center justify-center w-20 h-20 bg-green-100 rounded-full mb-4">
                    <span class="material-icons text-primary text-5xl">emoji_events</span>
                </div>
                <h1 class="text-3xl font-bold text-slate-900">Quiz Summary</h1>
                <p id="result-message" class="text-slate-500 mt-2">Analysis complete.</p>
            </div>

            <div class="px-6 -mt-8">
                <div class="bg-white rounded-3xl shadow-xl border border-slate-100 p-8 text-center">
                    <div class="text-6xl font-black text-primary mb-2" id="final-score">0</div>
                    <div class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-8">Points Earned</div>
                    
                    <div class="grid grid-cols-3 gap-4 border-t border-slate-100 pt-8">
                        <div>
                            <div class="text-lg font-bold text-slate-800" id="stat-total">0</div>
                            <div class="text-[10px] font-bold text-slate-400 uppercase">Total</div>
                        </div>
                        <div class="border-l border-slate-100">
                            <div class="text-lg font-bold text-green-600" id="stat-accuracy">0%</div>
                            <div class="text-[10px] font-bold text-slate-400 uppercase">Accuracy</div>
                        </div>
                        <div class="border-l border-slate-100">
                            <div class="text-lg font-bold text-accent" id="stat-wrong">0</div>
                            <div class="text-[10px] font-bold text-slate-400 uppercase">Wrong</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="p-6 mt-6 flex-1">
                <h4 class="font-bold text-slate-800 mb-4">Detailed Review</h4>
                <div id="review-container" class="space-y-4"></div>
                
                <button onclick="location.reload()" class="w-full mt-10 bg-primary text-white font-bold py-4 rounded-xl shadow-lg transition-all mb-10">
                    Try Another Chapter
                </button>
            </div>
        </div>
    </div>

    <script>
        const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRJZEkxEDWul6x7wRY41Kynb-JF-4ZE5L9jLhYy2qgdlM3gKjB2vPAMG19CCwBhcUW3f1NR71IxOLT-/pub?output=csv";

        const App = {
            allQuestions: [],
            currentSet: [],
            answers: {},
            flags: new Set(),
            index: 0,
            timer: null,
            timeLeft: 0,
            paletteOpen: false,

            demoData: [
                { Chapter: "Algebra", Question: "If $a+b=5$ and $ab=6$, what is $a^2+b^2$?", OptionA: "13", OptionB: "15", OptionC: "11", OptionD: "25", Correct: "A" },
                { Chapter: "Geometry", Question: "Area of a circle with radius $7$ cm?", OptionA: "154", OptionB: "49", OptionC: "44", OptionD: "14", Correct: "A" }
            ],

            async init() {
                try {
                    const response = await fetch(SHEET_URL);
                    if(!response.ok) throw new Error();
                    const csvText = await response.text();
                    this.allQuestions = this.parseCSV(csvText);
                    document.getElementById('connection-status').innerHTML = '● Database Connected';
                    document.getElementById('connection-status').className = 'text-xs text-green-600 mt-2 font-bold';
                } catch (e) {
                    this.allQuestions = this.demoData;
                    document.getElementById('connection-status').innerHTML = '● Running in Demo Mode (Offline)';
                    document.getElementById('connection-status').className = 'text-xs text-orange-500 mt-2 font-bold';
                }
                this.populateChapters();
            },

            parseCSV(text) {
                const rows = text.split('\n').filter(r => r.trim());
                const headers = rows[0].split(',').map(h => h.trim());
                return rows.slice(1).map(row => {
                    const values = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim());
                    let obj = {};
                    headers.forEach((h, i) => obj[h] = values[i]);
                    return obj;
                });
            },

            populateChapters() {
                const chapters = [...new Set(this.allQuestions.map(q => q.Chapter))];
                const select = document.getElementById('select-chapter');
                select.innerHTML = '';
                chapters.forEach(chap => {
                    const opt = document.createElement('option');
                    opt.value = chap; opt.innerText = chap;
                    select.appendChild(opt);
                });
            },

            start() {
                const chap = document.getElementById('select-chapter').value;
                const countVal = parseInt(document.getElementById('selected-count').value);
                const pool = this.allQuestions.filter(q => q.Chapter === chap);
                
                this.currentSet = pool.sort(() => 0.5 - Math.random()).slice(0, countVal);
                if(this.currentSet.length === 0) return alert("No questions found!");

                this.timeLeft = this.currentSet.length * 60;
                this.index = 0;
                this.answers = {};
                this.flags = new Set();

                document.getElementById('screen-setup').classList.remove('active');
                document.getElementById('screen-quiz').classList.add('active');
                this.renderQuestion();
                this.updatePalette();
                this.runTimer();
            },

            runTimer() {
                this.timer = setInterval(() => {
                    this.timeLeft--;
                    let m = Math.floor(this.timeLeft / 60);
                    let s = this.timeLeft % 60;
                    document.getElementById('timer-display').innerText = `${m}:${s < 10 ? '0'+s : s}`;
                    if(this.timeLeft <= 0) this.finish();
                }, 1000);
            },

            renderQuestion() {
                const q = this.currentSet[this.index];
                document.getElementById('progress-text').innerText = `Question ${this.index + 1} / ${this.currentSet.length}`;
                document.getElementById('progress-bar').style.width = `${((this.index + 1) / this.currentSet.length) * 100}%`;
                
                const qTextEl = document.getElementById('question-text');
                qTextEl.innerHTML = q.Question;

                const container = document.getElementById('options-container');
                container.innerHTML = '';
                
                ['A','B','C','D'].forEach(key => {
                    const isSelected = this.answers[this.index] === key;
                    const btn = document.createElement('div');
                    btn.className = `p-4 rounded-xl border-2 cursor-pointer transition-all flex items-center ${isSelected ? 'border-primary bg-primary/5' : 'border-slate-100 bg-white hover:border-slate-300'}`;
                    btn.innerHTML = `
                        <div class="w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold mr-4 ${isSelected ? 'bg-primary text-white' : 'bg-slate-100 text-slate-500'}">${key}</div>
                        <div class="flex-1 font-medium text-slate-700">${q['Option'+key]}</div>
                    `;
                    btn.onclick = () => { this.answers[this.index] = key; this.renderQuestion(); this.updatePalette(); };
                    container.appendChild(btn);
                });

                document.getElementById('next-btn').style.display = (this.index === this.currentSet.length - 1) ? 'none' : 'block';
                document.getElementById('submit-btn').style.display = (this.index === this.currentSet.length - 1) ? 'block' : 'none';
                
                const flagBtn = document.getElementById('flag-btn');
                flagBtn.className = this.flags.has(this.index) ? 'p-2 rounded-xl border-2 border-yellow-400 bg-yellow-50 text-yellow-600' : 'p-2 rounded-xl border-2 border-slate-100 text-slate-400';

                if (window.MathJax) MathJax.typesetPromise([qTextEl, container]);
            },

            move(dir) {
                const newIdx = this.index + dir;
                if(newIdx >= 0 && newIdx < this.currentSet.length) {
                    this.index = newIdx;
                    this.renderQuestion();
                }
            },

            toggleFlag() {
                if(this.flags.has(this.index)) this.flags.delete(this.index);
                else this.flags.add(this.index);
                this.renderQuestion();
                this.updatePalette();
            },

            togglePalette() {
                const modal = document.getElementById('palette-modal');
                const overlay = document.getElementById('palette-overlay');
                this.paletteOpen = !this.paletteOpen;
                modal.classList.toggle('open', this.paletteOpen);
                overlay.style.opacity = this.paletteOpen ? '1' : '0';
                overlay.style.pointerEvents = this.paletteOpen ? 'auto' : 'none';
            },

            updatePalette() {
                const grid = document.getElementById('palette-grid');
                grid.innerHTML = '';
                this.currentSet.forEach((_, i) => {
                    const btn = document.createElement('button');
                    let bg = "bg-slate-50 border-slate-200 text-slate-400";
                    if(i === this.index) bg = "border-primary text-primary bg-primary/10 ring-2 ring-primary/20";
                    else if(this.flags.has(i)) bg = "bg-yellow-100 border-yellow-400 text-yellow-700";
                    else if(this.answers[i]) bg = "bg-primary border-primary text-white";
                    
                    btn.className = `aspect-square rounded-xl font-bold text-sm border-2 transition-all ${bg}`;
                    btn.innerText = i + 1;
                    btn.onclick = () => { this.index = i; this.renderQuestion(); this.togglePalette(); };
                    grid.appendChild(btn);
                });
            },

finish() {
                clearInterval(this.timer);
                let score = 0, wrong = 0, skipped = 0;
                let reviewData = [];

                this.currentSet.forEach((q, i) => {
                    const userAns = this.answers[i];
                    const isCorrect = userAns === q.Correct;
                    
                    if (isCorrect) score++;
                    else if (userAns) wrong++;
                    else skipped++;
                    
                    reviewData.push({
                        question: q.Question,
                        options: { A: q.OptionA, B: q.OptionB, C: q.OptionC, D: q.OptionD },
                        userAnswer: userAns,
                        correctAnswer: q.Correct,
                        status: userAns ? (isCorrect ? 'correct' : 'incorrect') : 'skipped'
                    });
                });

                // UI Transition
                document.getElementById('screen-quiz').classList.remove('active');
                document.getElementById('screen-results').classList.add('active');

                // Stats Update
                document.getElementById('final-score').innerText = score;
                document.getElementById('stat-total').innerText = this.currentSet.length;
                document.getElementById('stat-wrong').innerText = wrong;
                document.getElementById('stat-accuracy').innerText = Math.round((score / this.currentSet.length) * 100) + '%';

                const container = document.getElementById('review-container');
                container.innerHTML = '';

                reviewData.forEach((item, i) => {
                    const card = document.createElement('div');
                    card.className = "mb-8 p-6 rounded-2xl border-2 border-slate-100 bg-white shadow-sm";
                    
                    // Header with Status Badge
                    let badge = '';
                    if(item.status === 'correct') badge = '<span class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-[10px] font-black uppercase">Correct</span>';
                    else if(item.status === 'incorrect') badge = '<span class="bg-red-100 text-red-700 px-3 py-1 rounded-full text-[10px] font-black uppercase">Incorrect</span>';
                    else badge = '<span class="bg-amber-100 text-amber-700 px-3 py-1 rounded-full text-[10px] font-black uppercase">Skipped</span>';

                    let optionsHtml = '';
                    ['A', 'B', 'C', 'D'].forEach(key => {
                        let bgColor = 'bg-slate-50 border-slate-100 text-slate-600';
                        let icon = '';

                        // Logic for highlighting
                        if (key === item.correctAnswer) {
                            bgColor = 'bg-green-50 border-green-500 text-green-700 font-bold';
                            icon = '<span class="material-icons text-sm ml-auto">check_circle</span>';
                        } else if (key === item.userAnswer && item.status === 'incorrect') {
                            bgColor = 'bg-red-50 border-red-400 text-red-700 font-bold';
                            icon = '<span class="material-icons text-sm ml-auto">cancel</span>';
                        }

                        optionsHtml += `
                            <div class="flex items-center p-3 mb-2 rounded-xl border-2 text-sm ${bgColor}">
                                <span class="mr-3 opacity-50">${key}.</span>
                                <span>${item.options[key]}</span>
                                ${icon}
                            </div>
                        `;
                    });

                    card.innerHTML = `
                        <div class="flex justify-between items-start mb-4">
                            <span class="text-xs font-bold text-slate-400 uppercase">Question ${i + 1}</span>
                            ${badge}
                        </div>
                        <div class="text-slate-800 font-medium mb-6 math-content">${item.question}</div>
                        <div class="space-y-1">
                            ${optionsHtml}
                        </div>
                    `;
                    container.appendChild(card);
                });

                if (window.MathJax) MathJax.typesetPromise([container]);
            }
        };

        document.addEventListener('DOMContentLoaded', () => App.init());
    </script>
</body>
</html>
